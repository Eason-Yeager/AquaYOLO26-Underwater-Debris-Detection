model: aquayolo26n
imgsz: 640
epochs: 200
batch: 16
optimizer: MuSGD
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
warmup_bias_lr: 0.1
mosaic: 1.0
close_mosaic: 10
mixup: 0.15
fliplr: 0.5
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 10.0
seed: 42
deterministic: true
train_ratio: 0.70
val_ratio: 0.15
test_ratio: 0.15
uda_target_images: 1000
uda_ratio: 1.0
seeds: [42, 123, 2024]

uwbn:
  enabled: true
  alpha_phys: [0.80, 0.04, 0.01]
  eps: 1.0e-5

turb_stal:
  enabled: true
  lambda_tau: 0.5
  small_area_threshold: 0.01
  k0: 10
  beta_k: 1.0
  lambda_turb: 0.01
  beta_proxy: 5.0

da_progloss:
  enabled: true
  lambda_max: 1.0
  gamma: 10.0
  source_target_ratio: 1.0
